{% extends "panel/base.html" %}
{% block content %}
<div class="steps"><i class="on"></i><i></i></div>
<h1>Panelga kirish</h1>
<p class="sub">1-bosqich: login va parol</p>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<form method="post" autocomplete="off" novalidate>
  {% csrf_token %}
  <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label for="u">Login</label>
  <input id="u" name="username" value="{{ username|default:'' }}" autocomplete="username" required autofocus>
  <label for="p">Parol</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Davom etish</button>
</form>
{% endblock %}
