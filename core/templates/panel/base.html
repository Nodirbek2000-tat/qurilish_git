<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kirish · Arxan</title>
  <style>
    :root { --ink:#111315; --paper:#f6f4ef; --line:#e3ded4; --muted:#6d6a64; --accent:#b85c38; --err:#b3261e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--paper); color:var(--ink);
           font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width:100%; max-width:400px; background:#fff; border:1px solid var(--line);
            border-radius:20px; padding:36px 32px; box-shadow:0 30px 60px -40px rgba(17,19,21,.35); }
    .logo { display:flex; align-items:flex-end; gap:10px; margin-bottom:28px; }
    .logo span { font-weight:700; letter-spacing:.32em; font-size:17px; }
    h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.01em; }
    .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
    .steps { display:flex; gap:6px; margin-bottom:20px; }
    .steps i { height:3px; flex:1; border-radius:3px; background:var(--line); }
    .steps i.on { background:var(--accent); }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
            font:inherit; background:#fff; outline:none; transition:border-color .2s, box-shadow .2s; }
    input:focus { border-color:var(--ink); box-shadow:0 0 0 4px rgba(17,19,21,.06); }
    .code { font-size:26px; letter-spacing:.5em; text-align:center; font-variant-numeric:tabular-nums; }
    button { width:100%; margin-top:22px; padding:14px; border:0; border-radius:12px; cursor:pointer;
             background:var(--ink); color:#fff; font:600 15px/1 inherit; transition:background .2s; }
    button:hover { background:var(--accent); }
    .err { background:#fdecea; color:var(--err); padding:10px 12px; border-radius:10px; font-size:14px; margin-bottom:8px; }
    .qr { display:grid; place-items:center; padding:12px; border:1px dashed var(--line); border-radius:14px; margin:6px 0 10px; }
    .qr svg { width:180px; height:180px; }
    .secret { font-family:ui-monospace, monospace; font-size:13px; text-align:center; color:var(--muted); word-break:break-all; }
    ol { padding-left:18px; color:var(--muted); font-size:14px; margin:0 0 6px; }
    .hp { position:absolute; left:-9999px; }
    a { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <g fill="#111315"><rect x="2" y="20" width="4" height="10"/><rect x="8" y="13" width="4" height="17"/>
        <rect x="14" y="4" width="4" height="26"/><rect x="20" y="13" width="4" height="17"/><rect x="26" y="20" width="4" height="10"/></g>
        <rect x="0" y="21.5" width="32" height="2" fill="#fff"/>
      </svg>
      <span>ARXAN</span>
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
